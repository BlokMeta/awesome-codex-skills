# Yerel geliştirme altyapısı (docs/01 §3). `pnpm db:up` ile ayağa kalkar.
name: heliograph

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: heliograph
      POSTGRES_PASSWORD: heliograph
      POSTGRES_DB: heliograph
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heliograph']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']

  temporal:
    image: temporalio/temporal:latest
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/data/temporal.db']
    ports: ['7233:7233', '8233:8233'] # 8233 = Temporal UI
    volumes: ['temporaldata:/data']

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/heliograph-media || true;
      mc anonymous set download local/heliograph-media || true;
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel/config.yaml']
    volumes: ['./tooling/otel/collector.yaml:/etc/otel/config.yaml:ro']
    ports: ['4317:4317', '4318:4318']

  grafana:
    image: grafana/grafana-oss:latest
    ports: ['3001:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ['grafanadata:/var/lib/grafana']

volumes:
  pgdata:
  temporaldata:
  miniodata:
  grafanadata:
